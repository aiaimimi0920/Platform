apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroloom-account-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuroloom-account-api
  template:
    metadata:
      labels:
        app: neuroloom-account-api
    spec:
      containers:
        - name: account-api
          image: ghcr.io/aiaimimi0920/neuroloom-platform-account-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: neuroloom-account-api-config
            - secretRef:
                name: neuroloom-account-api-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: neuroloom-account-api
spec:
  selector:
    app: neuroloom-account-api
  ports:
    - port: 4000
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroloom-gateway
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: neuroloom-gateway
  template:
    metadata:
      labels:
        app: neuroloom-gateway
    spec:
      terminationGracePeriodSeconds: 360
      containers:
        - name: gateway
          image: ghcr.io/aiaimimi0920/neuroloom-platform-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
              name: http
          envFrom:
            - configMapRef:
                name: neuroloom-gateway-config
            - secretRef:
                name: neuroloom-gateway-secret
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -TERM 1; sleep 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: neuroloom-gateway
spec:
  selector:
    app: neuroloom-gateway
  ports:
    - port: 4200
      targetPort: http
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroloom-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: neuroloom-gateway
---
