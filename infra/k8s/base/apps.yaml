apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroloom-public
spec:
  ingressClassName: traefik
  rules:
    - host: app.platform.neuroloom.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuroloom-web
                port:
                  name: http
    - host: api.platform.neuroloom.internal
      http:
        paths:
          - path: /internal/identity/linuxdo-upsert
            pathType: Exact
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /v1/me
            pathType: Exact
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /v1/wallet
            pathType: Prefix
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /v1/reputation
            pathType: Prefix
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /v1/daily-rewards
            pathType: Prefix
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /v1/mailbox
            pathType: Prefix
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuroloom-core
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroloom-account-public
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: account-traefik
  tls:
    - hosts:
        - account-api.platform.neuroloom.internal
        - new-api.platform.neuroloom.internal
      secretName: neuroloom-account-edge-tls
  rules:
    - host: account-api.platform.neuroloom.internal
      http:
        paths:
          - path: /v1/new-api
            pathType: Prefix
            backend:
              service:
                name: neuroloom-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuroloom-account-api
                port:
                  name: http
    - host: new-api.platform.neuroloom.internal
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: neuroloom-gateway
                port:
                  name: http
