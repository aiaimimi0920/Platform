apiVersion: batch/v1
kind: Job
metadata:
  name: neuroloom-core-migrate
  labels:
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: neuroloom-platform
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app.kubernetes.io/name: neuroloom-core-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/aiaimimi0920/neuro-platform-core
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - npm run db:migrate --workspace @neuro/core
          envFrom:
            - configMapRef:
                name: neuroloom-core-config
            - secretRef:
                name: neuroloom-core-secret
