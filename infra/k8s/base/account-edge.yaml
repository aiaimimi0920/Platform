apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuroloom-account-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neuroloom-account-edge
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neuroloom-account-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neuroloom-account-edge
subjects:
  - kind: ServiceAccount
    name: neuroloom-account-edge
    namespace: neuroloom
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: account-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroloom-account-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuroloom-account-edge
  template:
    metadata:
      labels:
        app: neuroloom-account-edge
    spec:
      serviceAccountName: neuroloom-account-edge
      containers:
        - name: traefik
          image: traefik:v3.1
          imagePullPolicy: IfNotPresent
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=account-traefik
            - --entrypoints.web.address=:8000
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:8443
            - --entrypoints.websecure.http.tls=true
            - --entrypoints.traefik.address=:8082
            - --ping=true
            - --ping.entrypoint=traefik
            - --api.dashboard=false
          ports:
            - containerPort: 8000
              name: web
            - containerPort: 8443
              name: websecure
            - containerPort: 8082
              name: traefik
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: neuroloom-account-edge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: neuroloom-account-edge
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
