apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuroloom-account-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neuroloom-account-edge
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neuroloom-account-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neuroloom-account-edge
subjects:
  - kind: ServiceAccount
    name: neuroloom-account-edge
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: account-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroloom-account-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuroloom-account-edge
  template:
    metadata:
      labels:
        app: neuroloom-account-edge
    spec:
      serviceAccountName: neuroloom-account-edge
      containers:
        - name: traefik
          image: docker.io/library/traefik
          imagePullPolicy: IfNotPresent
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=account-traefik
            - --providers.kubernetesingress.namespaces=$(POD_NAMESPACE)
            - --entrypoints.web.address=:8000
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:8443
            - --entrypoints.websecure.http.tls=true
            - --entrypoints.traefik.address=:8082
            - --ping=true
            - --ping.entrypoint=traefik
            - --api.dashboard=false
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8000
              name: web
            - containerPort: 8443
              name: websecure
            - containerPort: 8082
              name: traefik
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: neuroloom-account-edge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: neuroloom-account-edge
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
