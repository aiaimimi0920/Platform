apiVersion: batch/v1
kind: CronJob
metadata:
  name: neuroloom-reconcile-due
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: task
              image: ghcr.io/aiaimimi0920/neuro-platform-executor
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args: ["npm run run-task -- reconcile-due"]
              envFrom:
                - configMapRef:
                    name: neuroloom-executor-config
                - secretRef:
                    name: neuroloom-executor-secret
---
