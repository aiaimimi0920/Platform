name: Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "V*.*.*"
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "deploy/docker/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "scripts/container-image-lock.mjs"
      - "packages/**"
      - "core/**"
      - "executor/**"
      - "services/**"
      - "worker/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "deploy/docker/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "scripts/container-image-lock.mjs"
      - "packages/**"
      - "core/**"
      - "executor/**"
      - "services/**"
      - "worker/**"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: platform-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: deploy/docker/core.Dockerfile
          - image: account-api
            dockerfile: deploy/docker/account-api.Dockerfile
          - image: account-worker
            dockerfile: deploy/docker/account-worker.Dockerfile
          - image: worker
            dockerfile: deploy/docker/worker.Dockerfile
          - image: executor
            dockerfile: deploy/docker/executor.Dockerfile
          - image: web
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neuro-platform-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/V') }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform-${{ matrix.image }}
          cache-to: ${{ github.event.pull_request.head.repo.fork == false && format('type=gha,mode=max,scope=platform-{0}', matrix.image) || '' }}
          provenance: mode=max
          sbom: true

  publish:
    if: github.event_name != 'pull_request'
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: deploy/docker/core.Dockerfile
          - image: account-api
            dockerfile: deploy/docker/account-api.Dockerfile
          - image: account-worker
            dockerfile: deploy/docker/account-worker.Dockerfile
          - image: worker
            dockerfile: deploy/docker/worker.Dockerfile
          - image: executor
            dockerfile: deploy/docker/executor.Dockerfile
          - image: web
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neuro-platform-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/V') }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REFERENCE: ghcr.io/${{ github.repository_owner }}/neuro-platform-${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/container-image-lock.mjs entry
          --image "$IMAGE_NAME"
          --reference "$IMAGE_REFERENCE"
          --digest "$IMAGE_DIGEST"
          --revision "$SOURCE_REVISION"
          --repository "$SOURCE_REPOSITORY"
          --refName "$SOURCE_REF_NAME"
          --runId "$WORKFLOW_RUN_ID"
          --runAttempt "$WORKFLOW_RUN_ATTEMPT"
          --platform "linux/amd64"
          --output ".runtime/container-image-lock/image-lock-$IMAGE_NAME.json"

      - name: Upload immutable image digest
        uses: actions/upload-artifact@v4
        with:
          name: platform-image-lock-entry-${{ matrix.image }}-${{ github.run_id }}
          path: .runtime/container-image-lock/image-lock-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 14

  image-lock:
    if: github.event_name != 'pull_request'
    name: Aggregate immutable image lock
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download image digest entries
        uses: actions/download-artifact@v4
        with:
          pattern: platform-image-lock-entry-*-${{ github.run_id }}
          path: .runtime/container-image-lock
          merge-multiple: true

      - name: Aggregate image lock
        run: >-
          node scripts/container-image-lock.mjs aggregate
          --input ".runtime/container-image-lock"
          --output ".runtime/container-image-lock/image-lock.json"

      - name: Upload aggregate image lock
        uses: actions/upload-artifact@v4
        with:
          name: platform-container-image-lock-${{ github.run_id }}
          path: .runtime/container-image-lock/image-lock.json
          if-no-files-found: error
          retention-days: 30
