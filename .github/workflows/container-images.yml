name: Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "V*.*.*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: deploy/docker/core.Dockerfile
          - image: account-api
            dockerfile: deploy/docker/account-api.Dockerfile
          - image: account-worker
            dockerfile: deploy/docker/account-worker.Dockerfile
          - image: worker
            dockerfile: deploy/docker/worker.Dockerfile
          - image: executor
            dockerfile: deploy/docker/executor.Dockerfile
          - image: web
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neuro-platform-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/V') }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.image }}
          provenance: mode=max
          sbom: true
