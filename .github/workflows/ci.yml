name: Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspaces and topology
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Run Platform CI
        run: npm run ci

      - name: Validate integrated compose topology
        run: docker compose -f deploy/docker-compose.local.yml config --quiet

  release-contracts:
    name: Validate Windows release contracts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release build plan
        shell: powershell
        run: .\scripts\tests\test-build-platform-web-release-contract.ps1 -DryRunOnly

      - name: Validate release package verifier
        shell: powershell
        run: .\scripts\tests\test-verify-platform-web-release-package-contract.ps1

      - name: Validate release runtime smoke contract
        shell: powershell
        run: .\scripts\tests\test-smoke-platform-web-release-package-contract.ps1

      - name: Validate preview helper failure contracts
        shell: powershell
        run: .\scripts\tests\test-preview-helper-contract.ps1
