name: Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspaces and topology
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run repository contract
        run: node --test scripts/repository-contract.mjs

      - name: Run OpenTofu contract
        run: node --test scripts/acceptance/tests/tofu-contract.test.mjs

      - name: Validate OpenTofu environments
        run: npm run infra:tofu:validate

      - name: Run repository smoke checks
        run: node --test scripts/smoke.mjs

      - name: Build workspace dependencies
        run: npm run prepare:workspaces

      - name: Test contracts
        run: npm test --workspace @neuro/contracts --ignore-scripts

      - name: Test backend foundation
        run: npm test --workspace @neuro/backend-foundation --ignore-scripts

      - name: Test AI Gateway domain
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/ai-gateway-domain-tests.log"
          set +e
          npm test --workspace @neuro/ai-gateway-domain --ignore-scripts 2>&1 | tee "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            grep -E 'not ok|failureType:|[Ee]rror:|Cannot find module|Require stack|code:|stack:|ERR_' "$log_file" | head -n 80 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=AI Gateway domain test failure::$line"
            done
          fi
          exit "$test_status"

      - name: Test AI Gateway Vitest suites
        run: npm run test:vitest

      - name: Test account domain
        run: npm test --workspace @neuro/account-domain --ignore-scripts

      - name: Test account API
        run: npm test --workspace @neuro/account-api --ignore-scripts

      - name: Test account worker
        run: npm test --workspace @neuro/account-worker --ignore-scripts

      - name: Test Platform Core
        run: npm test --workspace @neuro/core --ignore-scripts

      - name: Test executor
        run: npm test --workspace @neuro/executor --ignore-scripts

      - name: Test worker
        run: npm test --workspace @neuro/worker --ignore-scripts

      - name: Test Web
        run: npm test --workspace @neuro/web --ignore-scripts

      - name: Run workspace typecheck
        run: npm run typecheck:workspaces

      - name: Validate integrated compose topology
        run: docker compose -f deploy/docker-compose.local.yml config --quiet

  release-contracts:
    name: Validate Windows release contracts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release build plan
        shell: powershell
        run: .\scripts\tests\test-build-platform-web-release-contract.ps1 -DryRunOnly

      - name: Validate release package verifier
        shell: powershell
        run: .\scripts\tests\test-verify-platform-web-release-package-contract.ps1

      - name: Validate release runtime smoke contract
        shell: powershell
        run: .\scripts\tests\test-smoke-platform-web-release-package-contract.ps1

      - name: Validate preview helper failure contracts
        shell: powershell
        run: .\scripts\tests\test-preview-helper-contract.ps1
