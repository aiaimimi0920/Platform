name: Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspaces and topology
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository contract
        run: node --test scripts/repository-contract.mjs

      - name: Run repository smoke checks
        run: node --test scripts/smoke.mjs

      - name: Build shared contracts
        run: npm run build --workspace @neuro/contracts

      - name: Test contracts
        run: npm test --workspace @neuro/contracts

      - name: Test backend foundation
        run: npm test --workspace @neuro/backend-foundation

      - name: Test AI Gateway domain
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/ai-gateway-domain-tests.log"
          set +e
          npm test --workspace @neuro/ai-gateway-domain 2>&1 | tee "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            grep -E 'not ok|failureType:|error:|code:|stack:|ERR_' "$log_file" | head -n 80 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=AI Gateway domain test failure::$line"
            done
          fi
          exit "$test_status"

      - name: Test account domain
        run: npm test --workspace @neuro/account-domain

      - name: Test account API
        run: npm test --workspace @neuro/account-api

      - name: Test account worker
        run: npm test --workspace @neuro/account-worker

      - name: Test Platform Core
        run: npm test --workspace @neuro/core

      - name: Test executor
        run: npm test --workspace @neuro/executor

      - name: Test worker
        run: npm test --workspace @neuro/worker

      - name: Test Web
        run: npm test --workspace @neuro/web

      - name: Run workspace typecheck
        run: npm run typecheck

      - name: Validate integrated compose topology
        run: docker compose -f deploy/docker-compose.local.yml config --quiet

  release-contracts:
    name: Validate Windows release contracts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release build plan
        shell: powershell
        run: .\scripts\tests\test-build-platform-web-release-contract.ps1 -DryRunOnly

      - name: Validate release package verifier
        shell: powershell
        run: .\scripts\tests\test-verify-platform-web-release-package-contract.ps1

      - name: Validate release runtime smoke contract
        shell: powershell
        run: .\scripts\tests\test-smoke-platform-web-release-package-contract.ps1
