name: Dependency Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv:
    name: Scan committed npm workspace lock
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      ref: ${{ github.ref }}
      scan-args: |-
        --lockfile=./package-lock.json
      upload-sarif: true
      fail-on-vuln: true
