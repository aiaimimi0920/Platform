name: Release Platform Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Vx.y.z tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "V*.*.*"

permissions:
  contents: write

concurrency:
  group: platform-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Platform Web
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLATFORM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and version
        shell: powershell
        run: |
          if ($env:PLATFORM_TAG -notmatch '^V\d+\.\d+\.\d+$') {
            throw "Release tag must match Vx.y.z: $env:PLATFORM_TAG"
          }
          git fetch origin main --tags
          git merge-base --is-ancestor "refs/tags/$env:PLATFORM_TAG" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must be reachable from origin/main: $env:PLATFORM_TAG"
          }
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $expectedTag = "V$($package.version)"
          if ($env:PLATFORM_TAG -ne $expectedTag) {
            throw "Tag/package version mismatch. Tag=$env:PLATFORM_TAG Expected=$expectedTag"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository contract
        run: node --test scripts/repository-contract.mjs

      - name: Run repository smoke checks
        run: node --test scripts/smoke.mjs

      - name: Run workspace unit tests
        run: npm test

      - name: Run workspace typecheck
        run: npm run typecheck

      - name: Build Platform Web release
        shell: powershell
        run: .\scripts\build-platform-web-release.ps1 -VersionId $env:PLATFORM_TAG -Force

      - name: Verify Platform Web release
        shell: powershell
        run: .\scripts\verify-platform-web-release-package.ps1 -PackageDir ".\release\Platform\$env:PLATFORM_TAG"

      - name: Runtime-smoke Platform Web release
        shell: powershell
        run: .\scripts\smoke-platform-web-release-package.ps1 -PackageDir ".\release\Platform\$env:PLATFORM_TAG"

      - name: Upload verified release package
        uses: actions/upload-artifact@v4
        with:
          name: platform-web-${{ env.PLATFORM_TAG }}
          path: release/Platform/${{ env.PLATFORM_TAG }}/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PLATFORM_TAG }}
          name: ${{ env.PLATFORM_TAG }}
          generate_release_notes: true
          files: |
            release/Platform/${{ env.PLATFORM_TAG }}/packages/Platform-${{ env.PLATFORM_TAG }}-web-next.zip
            release/Platform/${{ env.PLATFORM_TAG }}/packages/Platform-${{ env.PLATFORM_TAG }}-web-next.zip.sha256
            release/Platform/${{ env.PLATFORM_TAG }}/manifest.json
            release/Platform/${{ env.PLATFORM_TAG }}/checksums.sha256
